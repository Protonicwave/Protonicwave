<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-labelledby="t">
  <title id="t">Shlok Bhusal</title>
  <style>
    .name { font: 600 46px "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; letter-spacing: -0.5px; }
    .sub { font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #59636e; }
    .orbit { fill: none; stroke: #d1d9e0; stroke-width: 1; }
    .body { fill: #1f2328; }
    .accent { fill: #b0670a; }
  </style>
  <text x="24" y="100" class="name">Shlok Bhusal</text>
  <rect x="26" y="118" width="44" height="3" rx="1.5" class="accent"/>
  <text x="26" y="152" class="sub">physics with computer science, loughborough</text>
  <text x="26" y="176" class="sub">simulation, verification, software people use</text>
  <!-- Periods follow Kepler's third law: T is proportional to a^1.5. -->
  <g transform="translate(695 115) rotate(-14)">
    <path id="o1" class="orbit" d="M -62 0 A 62 17 0 1 1 62 0 A 62 17 0 1 1 -62 0"/>
    <path id="o2" class="orbit" d="M -110 0 A 110 30 0 1 1 110 0 A 110 30 0 1 1 -110 0"/>
    <path id="o3" class="orbit" d="M -158 0 A 158 43 0 1 1 158 0 A 158 43 0 1 1 -158 0"/>
    <circle r="7" class="accent"/>
    <circle r="2.5" class="body"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion></circle>
    <circle r="3.5" class="body"><animateMotion dur="16.5s" repeatCount="indefinite"><mpath href="#o2"/></animateMotion></circle>
    <circle r="4.5" class="accent"><animateMotion dur="28.5s" repeatCount="indefinite"><mpath href="#o3"/></animateMotion></circle>
  </g>
</svg>
